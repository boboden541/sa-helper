<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI Harness — Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1216; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.09);
    --text: #dfe6ee; --dim: #8b97a5; --acc: #6ea8fe; --ok: #59c98b; --warn: #e8b64c;
    --bad: #e0705f; --chip: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #182029 0%, var(--bg) 55%);
    color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.03); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .meta { color: var(--dim); font-size: 12.5px; }
  .spacer { flex: 1; }
  button {
    background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: rgba(110,168,254,.18); border-color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  button.danger:hover:not(:disabled) { background: rgba(224,112,95,.2); border-color: var(--bad); }
  .flag-chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); color: var(--warn);
  }
  .board { display: flex; gap: 12px; padding: 16px; overflow-x: auto; align-items: flex-start; }
  .col {
    min-width: 235px; width: 235px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; backdrop-filter: blur(8px);
  }
  .col h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 2px 4px 10px; font-weight: 600;
  }
  .col .count { float: right; color: var(--acc); }
  .card {
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--acc); }
  .card .tid { font-weight: 700; color: var(--acc); margin-right: 6px; }
  .card .sys { font-size: 11.5px; color: var(--dim); }
  .card .phase { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
  .card .iter { font-size: 11.5px; color: var(--warn); margin-top: 4px; }
  .card .acs { font-size: 11.5px; color: var(--ok); margin-top: 4px; }
  .card .desc { font-size: 12px; color: var(--dim); margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.escalated { border-color: var(--bad); }
  .empty { color: var(--dim); font-size: 12px; padding: 4px; }
  .conn { font-size: 12px; color: var(--dim); }
  .conn.on { color: var(--ok); }

  /* --- детализация задачи --- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(5,8,12,.6); z-index: 20;
    display: none; backdrop-filter: blur(3px);
  }
  .backdrop.open { display: block; }
  .panel {
    position: fixed; top: 3vh; right: 0; bottom: 0; width: min(680px, 94vw); z-index: 21;
    background: #12161c; border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .2s ease;
    display: flex; flex-direction: column;
  }
  .panel.open { transform: none; }
  .panel .phead {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .panel .phead .tid { font-weight: 700; color: var(--acc); font-size: 15px; }
  .panel .pbody { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .panel .pfoot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; }
  .panel .pfoot input { flex: 1; background: var(--chip); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 8px 12px; font: inherit; }
  .md h1, .md h2, .md h3 { margin: 14px 0 6px; font-size: 14px; color: var(--acc); }
  .md h1 { font-size: 16px; }
  .md p { margin: 6px 0; }
  .md code { background: var(--chip); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .md pre { background: var(--chip); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .md ul { margin: 6px 0; padding-left: 20px; }
  .md table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md th { color: var(--dim); font-weight: 600; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .chk { padding: 2px 0 2px 2px; }
  .chk .box { display: inline-block; width: 17px; text-align: center; border-radius: 4px;
    margin-right: 6px; font-size: 12px; border: 1px solid var(--line); background: var(--chip); }
  .chk.done { color: var(--dim); }
  .chk.done .box { color: var(--ok); border-color: var(--ok); }
  .chk.wip .box { color: var(--warn); border-color: var(--warn); }
  .chk.wip { color: var(--text); }
  .card .chkline { font-size: 11.5px; color: var(--acc); margin-top: 4px; }
  .card .live { font-size: 11.5px; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .card .live .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .card .live.on  { color: var(--ok); }   .card .live.on .dot  { background: var(--ok); }
  .card .live.dim { color: var(--dim); }  .card .live.dim .dot { background: var(--dim); }
  .card .live.warn{ color: var(--warn); } .card .live.warn .dot{ background: var(--warn); }
  .card .live .act { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 170px; }
  #p-banner { border: 1px solid var(--warn); background: rgba(232,182,76,.08);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
  #p-banner .btitle { color: var(--warn); font-weight: 600; }
  #p-banner button { margin-top: 8px; }
  /* --- портфель Stories --- */
  .stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; padding: 16px 20px; }
  .story { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s; }
  .story:hover { border-color: var(--acc); }
  .story .sfnr { font-weight: 700; color: var(--acc); }
  .story .stitle { margin: 4px 0 8px; }
  .story .smeta { font-size: 12px; color: var(--dim); }
  .story .sbar { height: 6px; border-radius: 3px; background: var(--chip); margin-top: 10px; overflow: hidden; }
  .story .sbar > i { display: block; height: 100%; background: var(--ok); }
  .story.pending { border-style: dashed; }
  .story.pending .sfnr::after { content: " · строится план…"; color: var(--warn); font-weight: 400; }
  .story.failed { border-color: var(--bad); }
  .story.failed .sfnr::after { content: " · нужен человек (gap-report)"; color: var(--bad); font-weight: 400; }
  #story-form { max-width: 720px; margin: 0 auto; padding: 16px 20px; }
  #story-form input, #story-form textarea { width: 100%; background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; margin-bottom: 10px; }
  #story-form textarea { min-height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  /* --- компонент «Чек-лист» --- */
  .clk-total { margin: 4px 0 14px; }
  .clk-total .bar { height: 8px; border-radius: 4px; background: var(--chip);
    border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
  .clk-total .bar > i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
  .clk-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px; }
  .clk-sec h3 { margin: 2px 0 8px; font-size: 13px; color: var(--acc); font-weight: 600; }
  .clk-sec .secmeta { font-size: 11.5px; color: var(--dim); margin-left: 8px; font-weight: 400; }
  .clk-item { display: flex; gap: 9px; padding: 5px 2px; align-items: baseline;
    border-top: 1px solid rgba(255,255,255,.04); font-size: 13px; }
  .clk-item:first-of-type { border-top: 0; }
  .clk-item .box { flex-shrink: 0; width: 20px; height: 20px; line-height: 18px; text-align: center;
    border-radius: 6px; border: 1px solid var(--line); background: var(--chip); font-size: 12px; }
  .clk-item.done { color: var(--dim); }
  .clk-item.done .box { color: var(--ok); border-color: var(--ok); }
  .clk-item.wip { color: var(--text); }
  .clk-item.wip .box { color: var(--warn); border-color: var(--warn); }
  .clk-item .st { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); margin-left: auto; flex-shrink: 0; }
  .clk-item.wip .st { color: var(--warn); }
  .comment { border-left: 3px solid var(--acc); padding: 4px 10px; margin: 8px 0; background: rgba(110,168,254,.05); border-radius: 0 8px 8px 0; }
  .comment .cmeta { font-size: 11.5px; color: var(--dim); }
  .comment.human { border-color: var(--ok); background: rgba(89,201,139,.05); }
  .comment.daemon { border-color: var(--warn); background: rgba(232,182,76,.05); }
  .tabbtn { font-size: 12.5px; padding: 4px 10px; }
  .tabbtn.active { border-color: var(--acc); color: var(--acc); }
  #p-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 18px 0; }
  #p-actions button { font-size: 12px; padding: 4px 10px; }
  #p-actions button.warn:hover:not(:disabled) { background: rgba(232,182,76,.18); border-color: var(--warn); }
  #p-actions button.danger:hover:not(:disabled) { background: rgba(224,112,95,.2); border-color: var(--bad); }
  .plog { background: var(--chip); border-radius: 8px; padding: 10px; overflow-x: auto;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  button.quiet { border: 0; background: none; color: var(--dim); padding: 7px 4px; font-size: 12.5px; }
  button.quiet:hover { color: var(--acc); background: none; border: 0; }
  #c-input.primary-hint { border-color: var(--warn); }
</style>
</head>
<body>
<header>
  <button id="back-btn" style="display:none">← Stories</button>
  <h1>AI Harness</h1>
  <span class="meta" id="fnr">—</span>
  <span class="meta" id="status"></span>
  <span class="spacer"></span>
  <span id="flags"></span>
  <button id="approve">Approve Plan</button>
  <button id="pause" class="danger">Pause</button>
  <span class="conn" id="conn">connecting…</span>
</header>

<div id="stories-view" style="display:none">
  <div id="story-form">
    <h2 style="margin:6px 0 12px; font-size:15px; color:var(--acc)">Новая Story</h2>
    <input id="ns-title" placeholder="Название Story (например: Перевод импорта на draft_db)">
    <textarea id="ns-source" placeholder="Текст СТ (markdown)… или абсолютный путь к файлу СТ"></textarea>
    <button id="ns-create">Создать Story и построить план</button>
    <span class="meta" id="ns-msg" style="margin-left:10px"></span>
  </div>
  <div class="stories" id="stories-grid"></div>
</div>
<div id="board-view" style="display:none">
<div class="board" id="board"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="panel" id="panel">
  <div class="phead">
    <span class="tid" id="p-tid">T?</span>
    <span class="meta" id="p-title"></span>
    <span class="spacer"></span>
    <button class="tabbtn active" id="tab-card">Карточка</button>
    <button class="tabbtn" id="tab-comments">Комментарии (<span id="c-count">0</span>)</button>
    <button class="tabbtn" id="tab-log">Лог стадии</button>
    <button class="tabbtn" id="tab-clk">Чек-лист</button>
    <button id="p-close">✕</button>
  </div>
  <div id="p-actions"></div>
  <div class="pbody">
    <div id="p-banner" style="display:none"></div>
    <div class="meta" id="p-meta" style="margin-bottom:8px"></div>
    <div class="md" id="p-card"></div>
    <div class="md" id="p-comments" style="display:none"></div>
    <div id="p-logwrap" style="display:none">
      <div class="meta" id="p-logmeta" style="margin-bottom:6px"></div>
      <pre class="plog" id="p-log">—</pre>
    </div>
    <div id="p-clkwrap" style="display:none">
      <div class="clk-total">
        <span class="meta" id="clk-total-label">—</span>
        <div class="bar"><i id="clk-total-bar" style="width:0%"></i></div>
      </div>
      <div id="clk-sections"></div>
    </div>
  </div>
  <div class="pfoot" id="p-commentbox" style="display:none">
    <input id="c-input" placeholder="Ваш комментарий к задаче…">
    <button id="c-send">Отправить</button>
    <button id="a-send" class="quiet" style="display:none" title="Уходят в сессию задачи; ответ появится в журнале">спросить агента</button>
  </div>
</div>

<script>
/* Канбан живёт по статусам конвейера v3 (task.pipeline); для документов v2
   без pipeline — маппинг из внутреннего статуса исполнителя. */
const V2_TO_PIPELINE = {
  PLANNED: "BACKLOG", APPROVED: "READY",
  TDD_RED: "IMPLEMENTING", TDD_GREEN: "IMPLEMENTING", GATES: "IMPLEMENTING",
  AGENT_REVIEW: "REVIEW", DONE: "DONE",
  ESCALATED_BLOCKED: "NEEDS_HUMAN", ABORTED: "ABORTED",
};
const PIPELINE_LABELS = {
  BACKLOG: "Backlog", READY: "Ready", IMPLEMENTING: "Implementing",
  REVIEW: "Review", DONE: "Done", VERIFIED: "Verified",
  BLOCKED: "Blocked", NEEDS_HUMAN: "Needs human", ABORTED: "Aborted",
};
function pipelineOf(t) {
  return t.pipeline || V2_TO_PIPELINE[t.status] || "BACKLOG";
}
const COLUMNS = [
  { key: "backlog", title: "Backlog",       match: p => p === "BACKLOG" },
  { key: "ready",   title: "Ready (следующие)", match: p => p === "READY" },
  { key: "impl",    title: "Implementing",  match: p => p === "IMPLEMENTING" },
  { key: "review",  title: "Review",        match: p => p === "REVIEW" },
  { key: "done",    title: "Done",          match: p => p === "DONE" },
  { key: "verif",   title: "Verified",      match: p => p === "VERIFIED" },
  { key: "blocked", title: "Blocked / Needs human",
    match: p => p === "BLOCKED" || p === "NEEDS_HUMAN" || p === "ABORTED" },
];

/* --- мини-markdown: заголовки, списки, таблицы, код, жирный, инлайн-код --- */
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
function md(src) {
  const lines = (src || "").split("\n");
  let html = "", i = 0, inCode = false, codeBuf = [];
  const flushList = buf => buf.length ? "<ul>" + buf.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>" : "";
  let listBuf = [];
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      html += flushList(listBuf); listBuf = [];
      if (!inCode) { inCode = true; codeBuf = []; }
      else { html += `<pre>${esc(codeBuf.join("\n"))}</pre>`; inCode = false; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (/^\|/.test(line.trim())) {
      html += flushList(listBuf); listBuf = [];
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
      if (rows.length >= 2) {
        const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
        html += "<table><tr>" + cells(rows[0]).map(c => `<th>${c}</th>`).join("") + "</tr>";
        for (const r of rows.slice(2)) html += "<tr>" + cells(r).map(c => `<td>${c}</td>`).join("") + "</tr>";
        html += "</table>";
      }
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { html += flushList(listBuf); listBuf = []; html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^---+$/.test(line.trim())) { html += flushList(listBuf); listBuf = []; html += "<hr>"; i++; continue; }
    const chk = line.match(/^\s*-\s+\[( |~|x)\]\s*(.*)$/);
    if (chk) {
      html += flushList(listBuf); listBuf = [];
      const cls = chk[1] === "x" ? "done" : chk[1] === "~" ? "wip" : "todo";
      const glyph = chk[1] === "x" ? "✓" : chk[1] === "~" ? "⟳" : "☐";
      html += `<div class="chk ${cls}"><span class="box">${glyph}</span>${inline(chk[2])}</div>`;
      i++; continue;
    }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { listBuf.push(li[1]); i++; continue; }
    if (line.trim() === "") { html += flushList(listBuf); listBuf = []; i++; continue; }
    html += flushList(listBuf); listBuf = [];
    html += `<p>${inline(line)}</p>`; i++;
  }
  html += flushList(listBuf);
  return html;
}

function liveLine(t) {
  const lv = t.live;
  if (!lv) return "";
  const age = lv.hb_age_s < 60 ? lv.hb_age_s + "с" : Math.round(lv.hb_age_s / 60) + "мин";
  let cls, label;
  if (lv.running && lv.hb_age_s < 180) { cls = "on";  label = `агент работает (шаг ${age} назад)`; }
  else if (lv.running)                 { cls = "warn"; label = `агент занят давно (${age} без вывода)`; }
  else                                 { cls = "dim"; label = `стадия завершена ${age} назад — ждёт перехода`; }
  return `<div class="live ${cls}"><span class="dot"></span>${label}` +
         (lv.last_action ? `<span class="act">· ${esc(lv.last_action)}</span>` : "") + `</div>`;
}

function card(t) {
  const acs = (t.acceptance_criteria || []);
  const passed = acs.filter(a => a.status === "PASSED").length;
  const div = document.createElement("div");
  div.className = "card" + (t.status === "ESCALATED_BLOCKED" ? " escalated" : "");
  div.onclick = () => openTask(t.id);
  const inner = t.status && t.status !== "PLANNED" && t.status !== "APPROVED" ? t.status : "";
  div.innerHTML =
    `<div><span class="tid">${t.id}</span><span class="sys">${t.system || ""}</span>` +
    `<span class="phase">${PIPELINE_LABELS[pipelineOf(t)] || pipelineOf(t)}</span>` +
    (inner ? `<span class="phase">${inner}</span>` : "") +
    (t.paused ? `<span class="phase" style="color:var(--warn)">⏸ пауза</span>` : "") +
    `</div>` +
    `<div>${t.title || ""}</div>` +
    (t.description ? `<div class="desc">${esc(t.description)}</div>` : "") +
    ((inner && inner.startsWith("TDD")) ? `<div class="iter">итерация ${t.iteration_count || 0}/4</div>` : "") +
    (t.review_iterations ? `<div class="iter">ревью: ${t.review_iterations}/3</div>` : "") +
    ((t.checklist && t.checklist.total) ? `<div class="chkline">☑ план ${t.checklist.done}/${t.checklist.total}` +
      (t.checklist.in_progress ? ` · в работе: ${t.checklist.in_progress}` : "") + `</div>` : "") +
    (acs.length ? `<div class="acs">AC ${passed}/${acs.length}</div>` : "") +
    liveLine(t) +
    (pipelineOf(t) === "BACKLOG" && (t.depends_on || []).length ? `<div class="live dim">ждёт: ${t.depends_on.join(", ")}</div>` : "");
  return div;
}

let CURRENT = null;
let LAST_FP = null;
function render(state) {
  const m = state.manifest || {};
  document.getElementById("fnr").textContent = m.fnr_id ? `${m.fnr_id} · ${m.epic_branch || ""}` : "манифест не найден";
  document.getElementById("status").textContent = m.status ? `статус: ${m.status}` : "";
  const flags = state.flags || [];
  document.getElementById("flags").innerHTML = flags.map(f => `<span class="flag-chip">${f}</span>`).join(" ");
  document.getElementById("approve").disabled = flags.includes("APPROVE_PLAN");
  document.getElementById("pause").textContent = flags.includes("PAUSE") ? "Resume" : "Pause";

  const fpChanged = state.comments_fp !== LAST_FP;
  LAST_FP = state.comments_fp;
  if (CURRENT && fpChanged && LAST_FP !== null) {  // живое обновление открытой карточки и комментариев
    const t = (m.tasks || []).find(x => x.id === CURRENT);
    if (t) fillDetail(t);
    if (document.getElementById("p-comments").style.display !== "none") refreshComments();
  }

  const tasks = m.tasks || [];
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (const col of COLUMNS) {
    const el = document.createElement("div");
    el.className = "col";
    const list = tasks.filter(t => col.match(pipelineOf(t)));
    el.innerHTML = `<h2>${col.title}<span class="count">${list.length}</span></h2>`;
    if (!list.length) el.insertAdjacentHTML("beforeend", `<div class="empty">—</div>`);
    for (const t of list) el.appendChild(card(t));
    board.appendChild(el);
  }
}

/* --- детализация --- */
function parseComments(mdText) {
  const out = [];
  for (const line of (mdText || "").split("\n")) {
    const m = line.match(/^\s*-\s+\[([^\]]+?)\s*\|\s*([^\]]+?)\s*\]\s*(.*)$/);
    if (m) out.push({ ts: m[1], author: m[2], text: m[3] });
    else if (out.length && line.trim()) out[out.length - 1].text += "\n" + line;
  }
  return out;
}

function fillDetail(t) {
  document.getElementById("p-tid").textContent = t.id;
  document.getElementById("p-title").textContent = t.title || "";
  const acs = (t.acceptance_criteria || []);
  const gates = t.gates || {};
  document.getElementById("p-meta").innerHTML =
    `${t.system || ""} · фаза: ${t.phase || "—"} · конвейер: ${PIPELINE_LABELS[pipelineOf(t)] || pipelineOf(t)}` +
    (t.status ? ` · исполнитель: ${t.status}` : "") +
    ` · AC ${acs.filter(a => a.status === "PASSED").length}/${acs.length}` +
    ` · итераций: ${t.iteration_count || 0}/4` +
    (t.branch ? ` · <code>${esc(t.branch)}</code>` : "") +
    (Object.keys(gates).length ? ` · гейты: ${Object.entries(gates).map(([k, v]) => `${k}=${v}`).join(", ")}` : "");
  const comments = parseComments(document.getElementById("p-comments").dataset.raw || "");
  document.getElementById("c-count").textContent = comments.length;
  renderActions(t);
  // баннер и кнопка «ответить и вернуть в работу» для состояний, требующих человека
  const banner = document.getElementById("p-banner");
  const send = document.getElementById("c-send");
  const quiet = document.getElementById("a-send");
  const input = document.getElementById("c-input");
  const pipeline = t.pipeline || "";
  if (pipeline === "NEEDS_HUMAN" || pipeline === "BLOCKED") {
    banner.style.display = "";
    banner.innerHTML =
      `<span class="btitle">${pipeline === "BLOCKED" ? "⛔ Задача заблокирована" : "⏸ Требуется ваше участие"}</span>` +
      ` — отчёт и ход работы: в комментариях ниже. Напишите ответ и нажмите жёлтую кнопку — задача вернётся в работу.`;
    send.textContent = "Ответить и вернуть в работу";
    send.dataset.flag = `TASK_${t.id}_RETRY`;
    send.style.borderColor = "var(--warn)";
    input.placeholder = "Ваш ответ задаче… (ушдёт в журнал и вернёт задачу в работу)";
  } else if (pipeline === "DONE") {
    banner.style.display = "none";
    send.textContent = "Вернуть на доработку";
    send.dataset.flag = `TASK_${t.id}_REQUEST_CHANGES`;
    send.style.borderColor = "var(--warn)";
    input.placeholder = "Что переделать… (станет заданием доработки)";
  } else {
    banner.style.display = "none";
    send.textContent = "Отправить";
    send.dataset.flag = "";
    send.style.borderColor = "";
    input.placeholder = "Ваш комментарий к задаче…";
  }
  quiet.style.display = t.can_ask ? "" : "none";
}

async function openTask(id) {
  CURRENT = id;
  document.getElementById("backdrop").classList.add("open");
  document.getElementById("panel").classList.add("open");
  showTab("card");
  const res = await fetch(api(`/api/task/${id}`));
  const doc = await res.json();
  fillDetail(doc.task || {});
  document.getElementById("p-card").innerHTML = md(doc.card_md) || "<p class='empty'>карточка не найдена</p>";
  const cEl = document.getElementById("p-comments");
  cEl.dataset.raw = doc.comments_md || "";
  renderComments(cEl.dataset.raw);
  LAST_CHECKLIST = doc.checklist_sections || [];
}

function renderComments(raw) {
  const cEl = document.getElementById("p-comments");
  const comments = parseComments(raw);
  document.getElementById("c-count").textContent = comments.length;
  cEl.innerHTML = comments.length
    ? comments.map(c =>
        `<div class="comment ${c.author}"><div class="cmeta">${esc(c.ts)} · ${esc(c.author)}</div>` +
        inline(c.text).replace(/\n/g, "<br>") + `</div>`).join("")
    : "<p class='empty'>комментариев пока нет</p>";
}

function showTab(which) {
  const cardEl = document.getElementById("p-card"), comEl = document.getElementById("p-comments");
  const bc = document.getElementById("tab-card"), bcom = document.getElementById("tab-comments");
  cardEl.style.display = which === "card" ? "" : "none";
  comEl.style.display = which === "comments" ? "" : "none";
  const logWrap = document.getElementById("p-logwrap");
  logWrap.style.display = which === "log" ? "" : "none";
  document.getElementById("p-clkwrap").style.display = which === "clk" ? "" : "none";
  document.getElementById("tab-clk").classList.toggle("active", which === "clk");
  if (which === "clk") renderChecklist();
  bc.classList.toggle("active", which === "card");
  bcom.classList.toggle("active", which === "comments");
  document.getElementById("tab-log").classList.toggle("active", which === "log");
  document.getElementById("p-commentbox").style.display = which === "comments" ? "flex" : "none";
  document.getElementById("p-actions").style.display = which === "card" ? "" : "none";
  if (which === "log" && CURRENT) {
    loadLog(CURRENT);
    if (!logTimer) logTimer = setInterval(() => CURRENT && loadLog(CURRENT), 3000);
  } else if (logTimer) {
    clearInterval(logTimer); logTimer = null;
  }
}

async function refreshComments() {
  if (!CURRENT) return;
  const res = await fetch(api(`/api/task/${CURRENT}`));
  const doc = await res.json();
  document.getElementById("p-comments").dataset.raw = doc.comments_md || "";
  renderComments(doc.comments_md || "");
}

function closePanel() {
  CURRENT = null;
  document.getElementById("backdrop").classList.remove("open");
  document.getElementById("panel").classList.remove("open");
}
document.getElementById("p-close").onclick = closePanel;
document.getElementById("backdrop").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
const ACTION_LABELS = {
  REQUEST_CHANGES: "Вернуть на доработку", FORCE_APPROVE: "Принять (force)",
  RETRY: "Повторить", RESUME_WORK: "Возобновить", PAUSE: "Пауза",
  RESUME: "Продолжить", ABORT: "Остановить",
};

function renderActions(t) {
  const box = document.getElementById("p-actions");
  if (!box) return;
  box.innerHTML = "";
  for (const flag of (t.actions || [])) {
    const key = flag.split("_").slice(2).join("_");
    const label = ACTION_LABELS[key];
    if (!label) continue;
    const b = document.createElement("button");
    b.textContent = label;
    if (key === "ABORT") b.className = "danger";
    if (key === "FORCE_APPROVE") b.className = "warn";
    b.onclick = () => fetch(api(`/api/flag/${flag}`), { method: "POST" }).then(() => openTask(t.id));
    box.appendChild(b);
  }
}

let LAST_CHECKLIST = [];

function renderChecklist() {
  const secs = LAST_CHECKLIST || [];
  const total = secs.reduce((a, s) => a + s.total, 0);
  const done = secs.reduce((a, s) => a + s.done, 0);
  const wip = secs.reduce((a, s) => a + s.wip, 0);
  document.getElementById("clk-total-label").textContent =
    total ? `Всего: ${done}/${total} закрыто` + (wip ? ` · ${wip} в работе` : "") : "чек-лист ещё не заведён (агент создаст его на старте задачи)";
  document.getElementById("clk-total-bar").style.width = total ? (100 * done / total) + "%" : "0%";
  const box = document.getElementById("clk-sections");
  box.innerHTML = secs.map(s => {
    const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
    const items = s.items.map(i =>
      `<div class="clk-item ${i.state}"><span class="box">${i.state === "done" ? "✓" : i.state === "wip" ? "⟳" : ""}</span>` +
      `<span>${inline(i.text)}</span><span class="st">${i.state === "done" ? "done" : i.state === "wip" ? "in progress" : "to do"}</span></div>`).join("");
    return `<div class="clk-sec"><h3>${inline(s.title)}<span class="secmeta">${s.done}/${s.total} · ${pct}%</span></h3>${items}</div>`;
  }).join("") || "<p class='empty'>Разделов с чекбоксами в карточке пока нет.</p>";
}

let logTimer = null;
async function loadLog(taskId) {
  const res = await fetch(api(`/api/log/${taskId}`));
  const doc = await res.json();
  document.getElementById("p-log").textContent = doc.log || "лог стадии пока пуст";
  document.getElementById("p-logmeta").textContent =
    doc.file ? `${doc.file} (хвост 8 КБ)` : "стадия ещё не запускалась";
}

document.getElementById("tab-card").onclick = () => showTab("card");
document.getElementById("tab-comments").onclick = () => showTab("comments");
document.getElementById("tab-log").onclick = () => showTab("log");
document.getElementById("a-send").onclick = askAgent;
document.getElementById("c-send").onclick = sendComment;
document.getElementById("c-input").addEventListener("keydown", e => { if (e.key === "Enter") sendComment(); });

function sendComment(andAction) {
  const input = document.getElementById("c-input");
  const text = input.value.trim();
  if (!text || !CURRENT) return;
  const flag = andAction || document.getElementById("c-send").dataset.flag || "";
  fetch(api(`/api/comment/${CURRENT}`), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  }).then(() => {
    input.value = "";
    return flag ? fetch(api(`/api/flag/${flag}`), { method: "POST" }) : null;
  }).then(() => openTask(CURRENT)).catch(() => {});
}

function askAgent() {
  const input = document.getElementById("c-input");
  const q = input.value.trim();
  if (!q || !CURRENT) return;
  fetch(api(`/api/ask/${CURRENT}`), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: q }),
  }).then(() => {
    input.value = "";
    refreshComments();
  }).catch(() => {});
}

function flag(name, method) {
  fetch(api(`/api/flag/${name}`), { method: method || "POST" }).catch(() => {});
}

document.getElementById("approve").onclick = () => flag("APPROVE_PLAN");
document.getElementById("pause").onclick = () => {
  const hasPause = document.getElementById("pause").textContent === "Resume";
  flag("PAUSE", hasPause ? "DELETE" : "POST");
};

/* --- портфель Stories (порция F) --- */
let CURRENT_FNR = null;

function api(p) {
  return p + (CURRENT_FNR ? (p.includes("?") ? "&" : "?") + "fnr=" + CURRENT_FNR : "");
}

function showView(which) {
  document.getElementById("stories-view").style.display = which === "stories" ? "" : "none";
  document.getElementById("board-view").style.display = which === "board" ? "" : "none";
  document.getElementById("back-btn").style.display = which === "board" ? "" : "none";
}

function renderStories(stories) {
  const grid = document.getElementById("stories-grid");
  if (!stories.length) {
    grid.innerHTML = "<p class='empty' style='padding:20px'>Stories пока нет — создайте первую выше.</p>";
    return;
  }
  grid.innerHTML = stories.map(s => {
    const done = (s.counts.DONE || 0) + (s.counts.VERIFIED || 0);
    const pct = s.tasks ? Math.round(100 * done / s.tasks) : 0;
    const cls = s.handoff_failed ? "failed" : s.handoff_pending ? "pending" : "";
    const counts = Object.entries(s.counts).map(([k, v]) => `${k}:${v}`).join(" · ") || "нет задач";
    return `<div class="story ${cls}" onclick="openStory('${s.fnr}')">` +
      `<div class="sfnr">${s.fnr}</div><div class="stitle">${esc(s.title)}</div>` +
      `<div class="smeta">${s.status} · задач: ${s.tasks}<br>${counts}</div>` +
      `<div class="sbar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function openStory(fnr) {
  CURRENT_FNR = fnr;
  showView("board");
  loadBoard();
}

async function loadBoard() {
  const res = await fetch(api("/api/state"));
  if (!res.ok) { document.getElementById("fnr").textContent = "Story не найдена"; return; }
  render(await res.json());
}

async function boot() {
  try {
    const res = await fetch("/api/stories");
    const data = await res.json();
    if (data.stories && data.stories.length) { showView("stories"); renderStories(data.stories); return; }
  } catch (e) { /* single-harness mode */ }
  showView("board");
  loadBoard();
}

document.getElementById("back-btn").onclick = () => {
  CURRENT_FNR = null;
  closePanel();
  showView("stories");
  fetch("/api/stories").then(r => r.json()).then(d => renderStories(d.stories || []));
};

document.getElementById("ns-create").onclick = () => {
  const title = document.getElementById("ns-title").value.trim();
  const source = document.getElementById("ns-source").value.trim();
  const msg = document.getElementById("ns-msg");
  if (!title || !source) { msg.textContent = "нужны название и СТ"; return; }
  msg.textContent = "создаю…";
  fetch("/api/story", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, source }) })
    .then(r => r.json()).then(d => {
      msg.textContent = d.ok ? `Story ${d.info} создана — демон строит план` : d.info;
      if (d.ok) {
        document.getElementById("ns-title").value = "";
        document.getElementById("ns-source").value = "";
        fetch("/api/stories").then(r => r.json()).then(x => renderStories(x.stories || []));
      }
    }).catch(() => { msg.textContent = "ошибка сети"; });
};

const es = new EventSource("/events");
es.onopen  = () => document.getElementById("conn").textContent = "live ✓";
es.onerror = () => document.getElementById("conn").textContent = "переподключение…";
es.onmessage = e => {
  const data = JSON.parse(e.data);
  if (data.stories) { if (CURRENT_FNR === null) renderStories(data.stories); return; }
  render(data);
};

boot();
</script>

rules:
  - id: sa-helper.go.struct-definition
    patterns:
      - pattern: "type $NAME struct { ... }"
    message: "Go struct definition"
    languages: [go]
    severity: INFO
    metadata:
      entity_type: class

  - id: sa-helper.go.function-definition
    patterns:
      - pattern-either:
          - pattern: "func $NAME(...) ... { ... }"
          - pattern: "func ($RECV *$TYPE) $NAME(...) ... { ... }"
    message: "Go function or method definition"
    languages: [go]
    severity: INFO
    metadata:
      entity_type: function

  - id: sa-helper.go.endpoint-gin
    patterns:
      - pattern-either:
          - pattern: "$R.GET($ROUTE, ...)"
          - pattern: "$R.POST($ROUTE, ...)"
          - pattern: "$R.PUT($ROUTE, ...)"
          - pattern: "$R.DELETE($ROUTE, ...)"
    message: "Go Gin/Echo REST Endpoint"
    languages: [go]
    severity: INFO
    metadata:
      entity_type: endpoint

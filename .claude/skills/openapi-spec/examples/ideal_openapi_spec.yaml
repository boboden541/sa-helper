openapi: 3.0.3
info:
  title: Catalog API — Shows
  version: 1.0.0
  description: >
    Эталонная OpenAPI 3.0.3 спецификация одного ресурса. Демонстрирует полный
    атрибутивный состав полей: required, nullable, pattern, minLength/maxLength,
    minimum/maximum, enum, format, example, а также переиспользование схем через
    $ref. Целевая версия — 3.0.3 (а не 3.1), потому что IDE-плагин
    «OpenAPI (Swagger) Editor» не поддерживает union-типы 3.1
    (`type: [string, "null"]`) и требует одиночный `type` + `nullable: true`.
    Все значения — иллюстративные; при генерации реальной спеки они берутся
    из кода (DTO/валидаторы/роутинг).
servers:
  - url: https://api.example.com
    description: Production
paths:
  /api/shows/{id}:
    get:
      operationId: getShowById
      summary: Получить шоу по идентификатору
      tags:
        - shows
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор шоу
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 42
        - name: expand
          in: query
          required: false
          description: Список связанных сущностей для разворачивания
          schema:
            type: array
            items:
              type: string
              enum:
                - seasons
                - poster
            example:
              - seasons
      responses:
        '200':
          description: Шоу найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
        '404':
          description: Шоу не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/shows:
    post:
      operationId: createShow
      summary: Создать шоу
      tags:
        - shows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShowRequest'
      responses:
        '201':
          description: Шоу создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Show:
      type: object
      required:
        - id
        - title
        - slug
        - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Уникальный идентификатор
          example: 42
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название шоу
          example: Breaking Bad
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 200
          description: URL-совместимый идентификатор
          example: breaking-bad
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          description: Статус публикации
          example: published
        rating:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 10
          description: Рейтинг; null, если ещё не оценено (nullable, OpenAPI 3.0)
          example: 9.5
        description:
          type: string
          nullable: true
          maxLength: 5000
          description: Описание; может отсутствовать
          example: Химия, деньги и моральное падение.
        genres:
          type: array
          items:
            type: string
          description: Жанры (массив скаляров)
          example:
            - drama
            - crime
        poster:
          $ref: '#/components/schemas/Image'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'
          description: Сезоны (массив объектов)
    Image:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Ссылка на изображение
          example: https://cdn.example.com/posters/42.jpg
        width:
          type: integer
          minimum: 1
          example: 600
        height:
          type: integer
          minimum: 1
          example: 900
    Season:
      type: object
      required:
        - number
        - episodes
      properties:
        number:
          type: integer
          minimum: 1
          description: Номер сезона
          example: 1
        episodes:
          type: integer
          minimum: 0
          description: Количество эпизодов
          example: 7
    CreateShowRequest:
      type: object
      required:
        - title
        - slug
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Better Call Saul
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 200
          example: better-call-saul
        status:
          type: string
          enum:
            - draft
            - published
          default: draft
          example: draft
        genres:
          type: array
          items:
            type: string
          example:
            - drama
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Машиночитаемый код ошибки
          example: 404
        message:
          type: string
          description: Человекочитаемое сообщение
          example: Show not found

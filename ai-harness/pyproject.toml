[project]
name = "ai-harness"
version = "0.1.0"
description = "AI-Harness: task-tracker и конвейер автоматизации реализации фичей (FNR-13)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]
daemon = [
    "claude-agent-sdk>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Структура по СТ §2.3: пакеты backend/src (api, usecase, domain, repository,
# infrastructure) и daemon — общая библиотека домена для API и демона.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend/src", "."]
include = ["api*", "usecase*", "domain*", "repository*", "infrastructure*", "daemon*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["backend/src", "."]

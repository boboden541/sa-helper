server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker-сети для динамического переопределения IP бэкенда при его перезапуске
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream "http://backend:8000";

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (/activity/stream, /live, лог прогона, Eve) без буферизации:
        # бэкенд шлёт X-Accel-Buffering: no, здесь — страховка на уровне nginx
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # агентные ответы Eve живут минутами — не рубить по 60 с
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # index.html — всегда свежий (пересборки меняют хэши ассетов);
    # сами ассеты иммутабельны и кэшируются на год
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}

# Встроенный пресет flow: обычная задача (постановка, «Задача (type = common_task)»)
statuses:
  - key: pending
    label: На рассмотрении
    alias: pending
    entry: true
    stage_desc: "Ожидает ручной модерации"
  - key: todo
    label: К работе
    alias: todo
    stage_desc: "Декомпозиция: smart-чеклист разработки и контекст"
  - key: in_progress
    label: В работе
    alias: progress
    gate: developer
    stage_desc: "Разработка по TDD, ведение чеклиста разработчика"
  - key: review_ready
    label: Готово к ревью
    alias: review
    stage_desc: "Ревьюер готовит чеклист проверки"
  - key: in_review
    label: На ревью
    alias: review
    gate: reviewer
    stage_desc: "Проверка кода и отчёт о ревью"
  - key: qa_ready
    label: Готово к тестированию
    alias: testing
    stage_desc: "Формируется чеклист тестирования"
  - key: in_testing
    label: На тестировании
    alias: testing
    gate: tester
    stage_desc: "Тестирование по чеклисту"
  - key: done
    label: Готово
    alias: done
    terminal: true
    stage_desc: "Реализована и протестирована"
  - key: canceled
    label: Отменено
    alias: canceled
    terminal: true
    stage_desc: "Задача отменена"
  - key: blocked
    label: Заблокировано
    alias: blocked
    blocking: true
    stage_desc: "Блокер; возврат после устранения"
transitions:
  - {from: pending, to: todo, runner: human, display: "Ручное вмешательство"}
  - {from: pending, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: todo, to: in_progress, runner: agent, display: "автомат (демон запускает агента)"}
  - {from: todo, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: todo, to: blocked, runner: human, display: "Ручное вмешательство"}
  - {from: in_progress, to: review_ready, runner: agent, display: "автомат"}
  - {from: in_progress, to: blocked, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: in_progress, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: review_ready, to: in_review, runner: agent, display: "автомат"}
  - {from: review_ready, to: blocked, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: review_ready, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: in_review, to: in_progress, runner: agent, display: "автомат (возврат на доработку)", cond_artifact: true}
  - {from: in_review, to: qa_ready, runner: agent, display: "автомат", cond_artifact: true}
  - {from: in_review, to: blocked, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: in_review, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: qa_ready, to: in_testing, runner: agent, display: "автомат"}
  - {from: qa_ready, to: blocked, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: qa_ready, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: in_testing, to: done, runner: agent, display: "автомат (этап пройден)", cond_artifact: true}
  - {from: in_testing, to: in_progress, runner: agent, display: "автомат (возврат на доработку)", cond_artifact: true}
  - {from: in_testing, to: blocked, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: in_testing, to: canceled, runner: human, display: "Ручное вмешательство"}
  - {from: blocked, to: in_progress, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: blocked, to: in_review, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: blocked, to: in_testing, runner: auto_or_agent, display: "Автоматом или ручное вмешательство"}
  - {from: blocked, to: canceled, runner: human, display: "Ручное вмешательство"}

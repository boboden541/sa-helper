services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-harness-postgres
    restart: unless-stopped
    ports:
      # только localhost: база не должна светиться на всех интерфейсах
      # (контейнеры ходят по сети compose, хостовые процессы — по 127.0.0.1;
      # решение владельца 04.11.2026 после внешних подключений к тестовой БД)
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_harness}
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
    volumes:
      # named volume: данные живут в ФС виртуальной машины Docker, а не на
      # bind-монте через virtiofs — транзакции больше не проходят через
      # файловый мост, краши «service fs failed» уходят (04.11.2026;
      # старая ./.pgdata на хосте оставлена как откат)
      - ai_harness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d ai_harness"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-harness-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # внутри сети compose постгрес доступен по имени сервиса на своём порту
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@postgres:5432/${POSTGRES_DB:-ai_harness}
      AI_HARNESS_TOKEN_KEY: ${AI_HARNESS_TOKEN_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      HARNESS_HOST_HOME: ${HOME}
      HARNESS_CONTAINER_HOME: /app/host-home
    # DNS контейнера: в корпоративных сетях Docker-резолвер (8.8.8.8) часто
    # заблокирован — задайте CONTAINER_DNS в .env (DNS своей сети); Eve и
    # агенты ходят наружу через этот канал
    dns:
      - ${CONTAINER_DNS:-8.8.8.8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # домашняя директория компьютера видна контейнеру: проекты можно
      # указывать любыми путями хоста (решение владельца 26.10.2026)
      - ${HOME}:/app/host-home
      - ./.harness:/app/host-harness
      # docker-сокет: Eve-агент управляет контейнерами (полный доступ,
      # решение владельца 28.10.2026)
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # только localhost: API с анонимным dev-доступом не должен светиться в LAN
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-harness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # только localhost (единая политика с postgres/backend)
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: ai-harness-daemon
    restart: unless-stopped
    profiles: ["daemon"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HOME}:/app/host-home
      # конфиг моста LiteLLM: демон рендерит, сайдкар читает (общий том)
      - ai_harness_bridge:/app/bridge-config
      # агенты сами управляют контейнерами стендов (решение владельца 31.10.2026;
      # глобальные правила — в методологиях демона/qa: проект задачи
      # harness-<КОД>, reuse вместо дублей, чужие контейнеры не трогать)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@postgres:5432/${POSTGRES_DB:-ai_harness}
      DAEMON_TICK_SECONDS: ${DAEMON_TICK_SECONDS:-30}
      AI_HARNESS_TOKEN_KEY: ${AI_HARNESS_TOKEN_KEY:-}
      HARNESS_HOST_HOME: ${HOME}
      HARNESS_CONTAINER_HOME: /app/host-home
      # мост LiteLLM для openai-подключений (Шаг 1 мультипротокола)
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-harness-bridge}
      BRIDGE_CONFIG_PATH: /app/bridge-config/config.yaml
      BRIDGE_CONTAINER: ai-harness-litellm
    # см. комментарий у backend: агенту нужен живой DNS до провайдера
    dns:
      - ${CONTAINER_DNS:-8.8.8.8}
    # мост к стендам на хосте (ticketscloud :5000, meili :7700 и пр.) —
    # без записи host.docker.internal не резолвится и stage недоступен агентам
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # пульс демона: app_setting daemon:heartbeat обновляется каждым тиком;
    # «призрак демона» (живой контейнер с мёртвым процессом) больше не невидим
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio, asyncpg, datetime as dt\nasync def chk():\n    c = await asyncpg.connect('postgresql://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@postgres:5432/${POSTGRES_DB:-ai_harness}')\n    v = await c.fetchval(\"SELECT value FROM app_setting WHERE key='daemon:heartbeat'\")\n    await c.close()\n    if not v: raise SystemExit('нет пульса')\n    age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(v).replace(tzinfo=dt.timezone.utc)).total_seconds()\n    if age > 150: raise SystemExit(f'пульс старше {age:.0f}s')\nasyncio.run(chk())",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    command: ["python", "-m", "daemon.main"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ai-harness-litellm
    # конфитог рендерит демон (daemon/bridge.py) в общий том; ro для сайдкара
    command: ["--config", "/app/bridge/config.yaml", "--port", "4000"]
    restart: unless-stopped
    volumes:
      - ai_harness_bridge:/app/bridge:ro
    environment:
      # мастер-ключ моста: SDK прогона авторизуется им, ключи провайдеров
      # остаются внутри конфига сайдкара
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-harness-bridge}
    # см. комментарий у backend: наружу ходит только к провайдерам
    dns:
      - ${CONTAINER_DNS:-8.8.8.8}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ai-harness-adminer
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  ai_harness_pgdata:
    external: true
  # конфиг моста LiteLLM: пишет демон, читает сайдкар (Шаг 1 мультипротокола)
  ai_harness_bridge:


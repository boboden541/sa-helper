services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-harness-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ai_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d ai_harness"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: ai-harness-adminer
    profiles: ["debug"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
